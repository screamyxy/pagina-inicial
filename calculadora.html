<main class="principal">
<section class="calculadora">
<h3>🧮Simulador de Pontos</h3>
 <div class="form-grid">
    <div class="form-group">
      <label> Arroz (5Kg) - 10 pontos</label>
      <input type="number" id="qtdeArroz" min="0"><!-- caixa de entrada-->
    </div>
    <div class="form-group">
      <label> Feijão (2Kg) - 8 pontos</label>
      <input type="number" id="qtdeFeijao" min="0">
        
    </div>
</div>
<!-- quando esse botão for clicado, a função calcular será chamada no JS -->
<button onclick="calcular()"> Calcular Total da Equipes</button>
<div id="resultado" class="resultado-box">
    Pontuação total: 0 pontos  
</div>
</section>   
    
</main>

<footer class="footer">
    <p>Coordenação Trote Solidário 2026: trotesolidario@facef.br</p>
    <p>Uni-FACEF - Centro Universitário Municipal de Franca</p>
</footer>

</body>
<script> <!--programar javascript-->
    function calcular(){
        //1. Obter os valores digitados pelo usuário
        //number é uma função que converte texto em número
        // parseInt() converte o texto em número inteiro
        // || 0 significa "ou zero" (caso o usuário não digite nada, considera 0)
        // document.getElementById("qtdeArroz") -> busca a caixa de entrada com o id "qtdeArroz"
        // .value -> pega o valor que está dentro da caixa
        // JS é uma linguagem não tipada (sem tipo de dados)
        let arroz = parseInt(document.getElementById("qtdeArroz").value) || 0;
        let feijao = parseInt(document.getElementById("qtdeFeijao").value) || 0;
        
        //2. Calcular os pontos
        // Multiplica a quantidade de arroz por 10 e a quantidade de feijão por 8

        let pontosArroz = arroz * 10;
        let pontosFeijao = feijao * 8;
        let total = pontosArroz + pontosFeijao;

        //3. Exibir o resultado
        document.getElementById("resultado").innerText = "Pontuação Total: " + total + " pontos";
    }

</script>
